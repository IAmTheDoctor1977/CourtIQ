<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rate pickleball players without self-rating: a supervised scenario test of court IQ plus an observed skills check.">
<meta name="theme-color" content="#2f5d8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Court IQ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Court IQ Rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one scorecard-width column; the court diagram leads each scenario. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17231d; --muted:#5b6a62; --line:#d7dfd9;
  --court:#2f5d8a; --court-fill:#e7eef5; --kitchen:#d5e3ee; --accent:#2f5d8a; --accent-ink:#ffffff;
  --us:#2f5d8a; --them:#c4532c; --ball:#e3b00c; --good:#2f7d4f; --warn:#b7791f; --bad:#b33a3a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211c; --fg:#e6ede8; --muted:#9aaba2; --line:#2a3832;
  --court:#8fb6dd; --court-fill:#16283a; --kitchen:#1d3550; --accent:#8fb6dd; --accent-ink:#0f1714;
  --us:#8fb6dd; --them:#ec8a63; --ball:#f2c94c; --good:#6cc28f; --warn:#e0a84a; --bad:#e07a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211c; --fg:#e6ede8; --muted:#9aaba2; --line:#2a3832;
  --court:#8fb6dd; --court-fill:#16283a; --kitchen:#1d3550; --accent:#8fb6dd; --accent-ink:#0f1714;
  --us:#8fb6dd; --them:#ec8a63; --ball:#f2c94c; --good:#6cc28f; --warn:#e0a84a; --bad:#e07a7a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2rem;text-transform:uppercase}
h1 span{color:var(--accent)}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:600 .9rem var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;min-width:0}
.muted{color:var(--muted)}
.label{font:500 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0;max-width:65ch}
label{display:grid;gap:4px;font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 180px;min-width:0}
.btn{font:700 1rem var(--f-body);border:1px solid var(--accent);border-radius:8px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.sm{font-size:.88rem;padding:6px 12px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.court{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.opt.best{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.worst{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt .letter{font:700 1.1rem var(--f-display);width:24px}
.opt .picks{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.b[aria-pressed="true"],.chip.yes[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.chip.w[aria-pressed="true"],.chip.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.chip.inc[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--accent-ink)}
.conf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.conf button{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:8px 4px;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font:700 3.6rem/1 var(--f-display);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:2px}
.stat b{font:700 2rem/1 var(--f-display)}
.bands{display:grid;gap:8px}
.band{display:grid;grid-template-columns:minmax(0,9rem) 1fr 48px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.bar i{display:block;height:100%}
.bar.th::after{content:"";position:absolute;left:70%;top:0;bottom:0;border-left:2px dashed var(--fg);opacity:.5}
.pill{display:inline-block;font:600 .75rem var(--f-body);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
.notice{border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg);border-radius:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px;background:var(--bg)}
.step.done{border-color:var(--good)}
.step b{font:700 1.05rem var(--f-display)}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
details.lvl{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
details.lvl summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;list-style:none}
details.lvl summary::-webkit-details-marker{display:none}
.skill{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px}
.skill .name{font-weight:700}
.skill .crit{font:500 .78rem var(--f-mono);color:var(--muted)}
.keyrow{display:grid;grid-template-columns:36px 1fr;gap:8px;font-size:.92rem}
.k{font:500 .85rem var(--f-mono);text-align:right}
.k.pos{color:var(--good)}.k.neg{color:var(--bad)}
.kiosk header{display:none}
.anim{display:grid;gap:2px}
.strip{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Court <span>IQ</span></h1>
    <nav id="nav" aria-label="Sections">
      <button id="nav-players" aria-current="true" data-view="players">Players</button>
      <button id="nav-bank" data-view="bank">Scenario bank</button>
      <button id="nav-skills" data-view="skillsref">Skills list</button>
      <button id="nav-settings" data-view="settings">Settings</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
// Court IQ scenario bank. 60 items: 4 levels x 5 domains x 3.
// Court coords: x 72-688 (net 380, kitchen lines 282/478), y 72-352 (centerline 212).
// You are always on the left half. "Top" = your left as you face the net.
// pl: [posKey | [x,y,team], label]; label starting with ^ is drawn above the player.
// ball: [x,y]; path: [x1,y1,x2,y2] dashed ball path; hit: same, solid opponent attack line.
// note: [x,y,text,anchor]; o: [option text, key -2..+2, rationale].
const KITCHEN4 = [['uKT','You'],['uKB','Partner'],['tKT','Opponent'],['tKB','Opponent']];
const BANK = [
// ---------------- 3.0 ----------------
{id:'P30a',lv:'3.0',dom:'pos',t:'You just hit a deep return',
 sit:"You're on the receiving team and just hit a deep crosscourt return. Your partner started at the kitchen line. Both opponents are at their baseline. What do you do now?",
 pl:[['uBB','You'],['uKT','Partner'],['tBT','Server'],['tBB','Opponent']],ball:[630,160],path:[110,274,622,162],note:[490,164,'Your deep return','middle'],
 o:[["Stay at the baseline until you see their third shot.",-1,"Leaves a split formation; their next ball targets the gap."],
    ["Move toward the kitchen line. If you're not there when they hit, split-step, then keep moving.",2,"A deep return buys time to advance; the split step keeps you balanced at their contact."],
    ["Sprint to the kitchen line without stopping.",0,"Gets you forward, but you're moving at contact and can't react to a ball at your feet."],
    ["Move forward only if your return was short.",-2,"Reversed logic: a short return gives you less time, not more."]]},
{id:'P30b',lv:'3.0',dom:'pos',t:'You just served',
 sit:"You just served from the right side. Your partner is at the baseline beside you. The returner is about to hit. Where do you stay until the return arrives?",
 pl:[['uBB','You'],['uBT','Partner'],['tBT','Returner'],['tKB','Opponent']],ball:[640,150],path:[110,272,630,152],note:[490,164,'Your serve','middle'],
 o:[["Stay back at the baseline and let the return bounce.",2,"The two-bounce rule means you must let the return bounce; staying back keeps it in front of you."],
    ["Follow your serve in toward the kitchen line.",-2,"You must let the return bounce, so you'll be caught mid-court with a ball at your feet."],
    ["Move to the middle of the court and wait there.",-1,"Mid-court is where deep returns land at your feet."],
    ["Stay back, but step a foot inside the baseline.",0,"Workable, but a deep return now lands at your feet."]]},
{id:'P30c',lv:'3.0',dom:'pos',t:'Your partner is returning serve',
 sit:"Your team is receiving and your partner is returning serve. You're standing at the baseline beside him. Where should you be before the serve?",
 pl:[['uBT','You'],['uBB','Partner'],['tBT','Server'],['tBB','Opponent']],
 o:[["At the kitchen line on your side.",2,"The returner's partner starts at the kitchen line; the receiving team gets there first."],
    ["At the baseline beside your partner.",-1,"Gives away the receiving team's built-in advantage."],
    ["Halfway between the baseline and kitchen.",-2,"The transition zone is where balls land at your feet."],
    ["At the kitchen line, but in the middle of the court.",0,"Right depth, but it leaves your sideline open."]]},
{id:'H30a',lv:'3.0',dom:'shot',t:'Deep return to you on the serving team',
 sit:"You're on the serving team and both of you are at the baseline. The return comes deep to you at medium pace; you have time to set your feet. Both opponents are now at the kitchen line. What do you hit?",
 pl:[['uBB','You'],['uBT','Partner'],['tKT','^Returner, now at the kitchen'],['tKB','Opponent']],ball:[126,266],path:[628,148,134,262],note:[150,304,'Deep, medium pace','start'],
 o:[["A soft drop into the kitchen, then move forward as it lands.",2,"Neutralizes the net team and lets you advance."],
    ["Drive it low at the middle, stay back, and drop the next ball.",1,"A sound drive-then-drop pattern with a little less control."],
    ["Lob over the opponents.",-1,"Low percentage from deep; a short lob gets put away."],
    ["Hit it high and soft down the middle to buy time to move up.",-2,"Hands them an attackable ball while you're in the transition zone."]]},
{id:'H30b',lv:'3.0',dom:'shot',t:'Returning serve',
 sit:"You're returning a medium-paced serve. Your partner is at the kitchen line. What return do you hit?",
 pl:[['uBB','You'],['uKT','Partner'],['tBT','Server'],['tBB','Opponent']],ball:[110,262],path:[650,150,118,260],note:[150,304,'Medium-paced serve','start'],
 o:[["A deep return with some arc, landing near their baseline.",2,"Keeps the server back and gives you time to reach the kitchen."],
    ["A hard, low drive that lands mid-court.",-1,"Comes back fast while you're still moving up."],
    ["A soft, short return into their kitchen.",-2,"Draws the server forward and gives you no time to advance."],
    ["A medium-depth return to the middle of their court.",0,"Playable, but gives the server an easier third shot."]]},
{id:'H30c',lv:'3.0',dom:'shot',t:'A low dink at your feet',
 sit:"All four players are at the kitchen line. The opponent's dink lands in the kitchen in front of you and stays low, below net height. What do you hit?",
 pl:KITCHEN4,ball:[300,150],path:[480,146,308,150],note:[296,124,'Below net height','start'],
 o:[["A soft dink back into their kitchen.",2,"A low ball can't be attacked; reset with a dink."],
    ["Hit it hard over the net.",-2,"From below the net, a hard ball rises and gets attacked."],
    ["Lob over the opponent.",-1,"Low percentage from the kitchen against a set opponent."],
    ["Push it firmly at the opponent's feet.",0,"Can work, but a firm ball from low often floats."]]},
{id:'T30a',lv:'3.0',dom:'part',t:'A drive heading long near your partner',
 sit:"All four players are at the kitchen line. An opponent drives a ball toward your partner. It's rising past his shoulders and looks like it will land out. What do you do?",
 pl:KITCHEN4,ball:[200,300],path:[480,282,212,298],note:[150,334,'Rising, shoulder height','start'],
 o:[["Call \"out\" or \"bounce\" loudly so he lets it go.",2,"Your partner is focused on the ball; you have the better view of its flight."],
    ["Say nothing; it's his ball.",-1,"A silent partner often watches a winnable point get played."],
    ["Reach across and hit it yourself.",-2,"Takes a likely-out ball on his side."],
    ["Let him decide on his own.",0,"Not wrong, but you're missing a chance to help."]]},
{id:'T30b',lv:'3.0',dom:'part',t:'A deep ball down the middle',
 sit:"You and your partner are both at the baseline. A deep ball comes down the middle, between you. Both of you are right-handed, and you're on the left side. Who takes it?",
 pl:[['uBT','You'],['uBB','Partner'],['tKT','Opponent'],['tKB','Opponent']],ball:[110,210],path:[480,200,120,210],
 o:[["You take it with your forehand and call it.",2,"The middle is on your forehand; forehand-in-the-middle is the default."],
    ["Leave it for your partner.",-1,"It's on his backhand."],
    ["Both go for it.",-2,"Leads to collisions or both players pulling off."],
    ["Whoever is closer takes it, without calling.",0,"Silence in the middle causes hesitation."]]},
{id:'T30c',lv:'3.0',dom:'part',t:'Your partner is pulled wide',
 sit:"All four players are at the kitchen line. A sharp crosscourt dink pulls your partner wide toward his sideline. Where do you move?",
 pl:[['uKT','You'],[[266,326,'u'],'^Partner, pulled wide'],['tKT','Opponent'],['tKB','Opponent']],ball:[290,330],path:[480,150,298,328],
 o:[["Shift toward the middle to cover the gap.",2,"Teams move together; the gap between you is the target."],
    ["Stay where you are.",-1,"Leaves the middle open."],
    ["Run across to cover his sideline.",-2,"Leaves your entire side and the middle open."],
    ["Back up toward the baseline.",-1,"Gives up the net with no reason to."]]},
{id:'R30a',lv:'3.0',dom:'read',t:'One opponent up, one back',
 sit:"One opponent is at the kitchen line; the other is stuck at the baseline. You have an easy ball at the kitchen. Where do you hit it?",
 pl:[['uKT','You'],['uKB','Partner'],['tKT','Opponent'],['tBB','Opponent']],ball:[294,152],path:[650,276,302,154],
 o:[["Low, at the feet of the player who's back.",2,"He has the hardest shot and the longest way to the net."],
    ["To the net player's paddle.",-2,"Feeds the opponent who's in the best position."],
    ["Lob over the net player.",0,"Possible, but the back player can cover it."],
    ["Hard down the middle.",1,"Good target, but less pressure than the back player's feet."]]},
{id:'R30b',lv:'3.0',dom:'read',t:'You notice a weak backhand',
 sit:"In warm-up, you notice the opponent across from you misses most of his backhands. What's your plan for the game?",
 pl:KITCHEN4,
 o:[["Hit to his backhand whenever you can.",2,"Play into the weakness you've identified."],
    ["Ignore it and play your normal game.",-1,"Wastes useful information."],
    ["Hit everything hard at him.",-1,"Pace without placement lets him block."],
    ["Avoid him and play his partner.",-2,"Plays away from the weakness."]]},
{id:'R30c',lv:'3.0',dom:'read',t:'A drive rising past your shoulders',
 sit:"You're at the kitchen line. An opponent's drive is still rising as it passes your shoulders. What do you do?",
 pl:KITCHEN4,ball:[240,126],path:[480,140,250,128],note:[110,100,'Rising past your shoulders','start'],
 o:[["Let it go; it's likely out.",2,"A ball still rising at the kitchen line usually lands long."],
    ["Swing at it.",-1,"Turns a likely-out ball into your error."],
    ["Duck and let your partner play it.",0,"Letting it go is right; leaving it to him adds confusion."],
    ["Back up and play it off the bounce.",-1,"Gives up the net to play a ball that's going out."]]},
{id:'G30a',lv:'3.0',dom:'game',t:'Score call after winning a point',
 sit:"You're the first server. The score was 5\u20133\u20131 and your team won the point. What happens next?",
 pl:[['uBB','You'],['uBT','Partner'],['tBT','Opponent'],['tBB','Opponent']],
 o:[["You switch sides with your partner, then serve at 6\u20133\u20131.",2,"The server keeps serving after a won point, switching sides each time."],
    ["You stay on the same side and serve at 6\u20133\u20131.",-2,"The server must switch sides after scoring."],
    ["Your partner serves next.",-1,"The serve stays with you until your team loses a rally."],
    ["You switch sides and call 6\u20133\u20132.",-1,"The server number changes only after a lost rally."]]},
{id:'G30b',lv:'3.0',dom:'game',t:'Side out: who serves first?',
 sit:"Your team just won the serve back (side out). Who serves first?",
 pl:[['uBB','You'],['uBT','Partner'],['tBT','Opponent'],['tBB','Opponent']],
 o:[["The player currently on the right (even) side.",2,"After a side out, the player on the right serves first."],
    ["Whoever served last for your team.",-1,"Serving order resets at the side out."],
    ["The player who served first in the game.",-1,"Their starting position checks score parity, not who serves first."],
    ["Either one; agree between you.",-2,"Serving out of order is a fault."]]},
{id:'G30c',lv:'3.0',dom:'game',t:'Up 10\u20138, one point from winning',
 sit:"You're up 10\u20138 in a game to 11 and serving. How do you play the point?",
 pl:[['uBB','You'],['uBT','Partner'],['tBT','Opponent'],['tBB','Opponent']],
 o:[["Same high-percentage play: deep serve, deep return, patient points.",2,"The pattern that got you to 10 is the safest way to finish."],
    ["Go for winners to close it out.",-1,"Raises your error rate when you're ahead."],
    ["Hit soft, high balls to avoid errors.",-2,"Gives them attackable balls."],
    ["Serve harder to try for an ace.",-1,"Missed serves give away the point."]]},
// ---------------- 3.5 ----------------
{id:'P35a',lv:'3.5',dom:'pos',t:'An opponent lobs over your partner',
 sit:"All four players are at the kitchen line. An opponent lobs over your partner's head, down the line; it will land deep. Your partner turns and runs back to chase it. What do you do?",
 pl:[['uKT','You'],['uKB','^Partner'],['tKT','Opponent'],['tKB','Opponent']],ball:[122,290],path:[480,280,130,290],note:[176,330,'Lob over your partner','middle'],
 o:[["Stay at the kitchen line in case they return it short.",-1,"Splits the team; their next ball goes through the gap."],
    ["Drop back with your partner so you're level when he hits.",2,"Keeps the team together to defend the next ball."],
    ["Slide over to cover his side of the kitchen line.",-1,"Leaves your side open while he is already on the ball."],
    ["Call \"switch\" and run back to chase it yourself.",-2,"Two players on one ball, no one covering the court."]]},
{id:'P35b',lv:'3.5',dom:'pos',t:'Your drop lands in the kitchen',
 sit:"You hit a third-shot drop from the baseline. It lands softly in their kitchen, so the opponent has to hit up. What do you do?",
 pl:[['uBB','You'],['uBT','Partner'],['tKT','Opponent'],['tKB','Opponent']],ball:[430,276],path:[112,278,422,276],note:[180,320,'Your drop','middle'],
 o:[["Move forward toward the kitchen line with your partner.",2,"A good drop earns the advance; go while they must hit up."],
    ["Stay back to see what they do.",-1,"Wastes the drop."],
    ["Move halfway in and stop there.",0,"Better than staying back, but leaves you in the transition zone."],
    ["Move forward only if your partner does.",-1,"Hesitation; both should read the drop."]]},

  const ov=(it.path?`<line x1="${it.path[0]}" y1="${it.path[1]}" x2="${it.path[2]}" y2="${it.path[3]}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#aa-${it.id})"/>`:'')
    +(it.hit?`<line x1="${it.hit[0]}" y1="${it.hit[1]}" x2="${it.hit[2]}" y2="${it.hit[3]}" stroke="var(--them)" stroke-width="2.5" marker-end="url(#ah-${it.id})"/>`:'')+note(it.note)+note(it.note2);
  return `<div class="anim" data-id="${it.id}">

   <g class="ov" style="opacity:0;transition:opacity .3s">${ov}</g>
   ${pl.map((p,i)=>{const col=p.team==='u'?'var(--us)':'var(--them)';return `<g class="pl" data-i="${i}" transform="translate(${p.x} ${p.y})"><circle r="16" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="3"/><text y="${p.up?-26:42}" text-anchor="middle" font-size="22" font-weight="${p.text==='You'?700:600}" fill="var(--fg)">${esc(p.text)}</text></g>`}).join('')}

   <line x1="72" y1="${GY-3*HS}" x2="688" y2="${GY-3*HS}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 5"/>
   <line x1="380" y1="${GY}" x2="380" y2="${GY-3*HS}" stroke="var(--fg)" stroke-width="5"/>
   <text x="694" y="${GY-3*HS+5}" font-size="21" fill="var(--muted)">net</text>
   <text x="72" y="${GY+24}" font-size="21" fill="var(--muted)">your baseline</text><text x="688" y="${GY+24}" text-anchor="end" font-size="21" fill="var(--muted)">their baseline</text>

  <div class="meta"><span class="label">Side view: ball height vs. net</span><button class="btn ghost sm replay" type="button">Replay</button></div></div>`;

function initAnim(el,it,{autoplay=false,onDone}={}){
  const A=it.anim,pl=plList(it),beats=A.beats;
  const st=[{pos:pl.map((p,i)=>A.start?.[i]||[p.x,p.y]),ball:beats[0].b.slice(0,3)}];
  beats.forEach((b,k)=>{const pos=st[k].pos.map((p,i)=>b.p?.[i]||p);st.push({pos,ball:b.b?b.b.slice(3,6):st[k].ball})});
  const total=beats.reduce((a,b)=>a+b.t,0);
  const gs=[...el.querySelectorAll('.pl')],ball=el.querySelector('.ball'),sh=el.querySelector('.shadow'),sb=el.querySelector('.sball'),ov=el.querySelector('.ov');
  const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  function frame(t){let k=0,acc=0;while(k<beats.length-1&&acc+beats[k].t<t){acc+=beats[k].t;k++}
    const u=Math.min(1,Math.max(0,(t-acc)/beats[k].t)),B=beats[k];
    gs.forEach((g,i)=>{const a=st[k].pos[i],b=st[k+1].pos[i],e=ease(u);g.setAttribute('transform',`translate(${a[0]+(b[0]-a[0])*e} ${a[1]+(b[1]-a[1])*e})`)});
    let x,y,h;if(B.b){const [x1,y1,h1,x2,y2,h2,ap]=B.b;x=x1+(x2-x1)*u;y=y1+(y2-y1)*u;const c=2*ap-(h1+h2)/2;h=Math.max(0,(1-u)*(1-u)*h1+2*u*(1-u)*c+u*u*h2)}else{[x,y,h]=st[k+1].ball}
    sh.setAttribute('cx',x);sh.setAttribute('cy',y);ball.setAttribute('cx',x);ball.setAttribute('cy',y-h*2.2);ball.setAttribute('r',7+h*0.18);
    sb.setAttribute('cx',x);sb.setAttribute('cy',Math.max(10,GY-h*HS));}
  let raf=0,done=false;
  function finish(){frame(total);ov.style.opacity=1;if(!done){done=true;onDone&&onDone()}}
  function run(){cancelAnimationFrame(raf);ov.style.opacity=0;const t0=performance.now();
    const loop=now=>{if(!el.isConnected)return;const e=now-t0;if(e>=total)return finish();frame(e);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
  el.querySelector('.replay').addEventListener('click',()=>REDUCE?finish():run());
  if(autoplay&&!REDUCE)run();else finish();
}
const scene=it=>it.anim?animBlock(it):court(it);
function initScenes(root,opts){root.querySelectorAll('.anim').forEach(el=>initAnim(el,byId[el.dataset.id],opts))}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- scenario test (kiosk) ----------
function renderTest(){
  const p=player();if(!p?.test?.items)return setView('players');
  const T=p.test;
  if(T.i==null||T.i<0)T.i=0;
  if(!T.started){
    V.innerHTML=`<section class="panel"><span class="label">Scenario test · ${esc(p.name)}</span>
      <h2>What would you do?</h2>
      <p>You'll see 25 game situations on a court diagram. For each one, pick the <b>best</b> and the <b>worst</b> of four options, then say how sure you are of your best pick.</p>
      <p>There's no time limit. Answer the way you would actually play it, not the way you think you're supposed to.</p>
      <p class="muted">Some situations play as a short animation first. The strip under the court shows how high the ball is compared with the net. Options appear when the play stops; you can replay it.</p>
      ${scene(byId.P30a)}${LEGEND}
      <div><button class="btn" id="begin">Begin</button></div>
      <div><button class="linkbtn" id="exit">Organizer: exit test</button></div></section>`;
    initScenes(V,{autoplay:true});
    document.getElementById('begin').onclick=()=>{T.started=true;renderTest()};
    document.getElementById('exit').onclick=()=>setView('player');
    return;
  }
  if(T.finished){
    V.innerHTML=`<section class="panel"><h2>All done</h2><p>Thanks, ${esc(p.name.split(' ')[0])}. Please hand the device back to the organizer.</p>
    <div><button class="btn ghost" id="exit">Organizer: continue</button></div></section>`;
    document.getElementById('exit').onclick=()=>setView('player');return;
  }
  const a=T.items[T.i],it=byId[a.id];const L='ABCD';
  V.innerHTML=`<section class="panel">
    <div class="meta"><span class="label">Scenario ${T.i+1} of ${T.items.length}</span><span class="label">${esc(it.t)}</span></div>
    <div class="progress"><i style="width:${T.i/T.items.length*100}%"></i></div>
    ${scene(it)}${LEGEND}<p>${esc(it.sit)}</p>
    <div id="answer" class="opts" style="gap:14px" ${it.anim&&!a.seen?'hidden':''}><div class="opts">${a.order.map((o,k)=>`<div class="opt ${a.best===o?'best':''} ${a.worst===o?'worst':''}"><span class="letter">${L[k]}</span><span>${esc(it.o[o][0])}</span>
      <span class="picks"><button class="chip b" data-o="${o}" data-t="best" aria-pressed="${a.best===o}">Best</button><button class="chip w" data-o="${o}" data-t="worst" aria-pressed="${a.worst===o}">Worst</button></span></div>`).join('')}</div>
    <div class="label">How sure are you of your best pick?</div>
    <div class="conf">${['Guessing','Unsure','Fairly sure','Certain'].map((t,k)=>`<button data-c="${k+1}" aria-pressed="${a.conf===k+1}">${t}</button>`).join('')}</div></div>
    <div class="meta"><button class="btn ghost" id="prev" ${T.i?'':'disabled'}>Back</button>
    <button class="btn" id="next" ${a.best!=null&&a.worst!=null&&a.conf?'':'disabled'}>${T.i===T.items.length-1?'Finish':'Next'}</button></div></section>`;
  if(it.anim)initAnim(V.querySelector('.anim'),it,{autoplay:!a.seen,onDone:()=>{a.seen=true;const an=document.getElementById('answer');if(an)an.hidden=false}});
  V.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const o=+b.dataset.o,t=b.dataset.t;a[t]=a[t]===o?null:o;const ot=t==='best'?'worst':'best';if(a[ot]===o)a[ot]=null;renderTest()});
  V.querySelectorAll('.conf button').forEach(b=>b.onclick=()=>{a.conf=+b.dataset.c;renderTest()});
  document.getElementById('prev').onclick=()=>{T.i--;renderTest();window.scrollTo(0,0)};
  document.getElementById('next').onclick=async()=>{
    const items=T.items.map(({id,order,best,worst,conf})=>({id,order,best,worst,conf}));
    if(T.i<T.items.length-1){T.i++;savePlayer(p,{test:{items,i:T.i}},true);renderTest();window.scrollTo(0,0)}
    else{const iq=scoreTest(items);iq.at=new Date().toISOString();
      const f={test:{items,i:T.i},iq};if(p.exec!=null)f.final=finalRating(iq.tier,p.exec);
      await savePlayer(p,f,true);p.iq=iq;if(f.final!=null)p.final=f.final;T.finished=true;renderTest();window.scrollTo(0,0)}};
}

    return `<details class="lvl" ${open?'open':''}><summary><span>${LNAME[L]} ${rec.includes(L)?'<span class="pill good">Test all</span>':'<span class="pill mut">Spot-check</span>'}</span><span class="muted">${st.marked}/${st.total} marked · ${pctS(st.pct)}</span></summary>
    ${SKILLS.filter(s=>s.level===L).map(s=>{const m=marks[s.id];return `<div class="skill"><span class="name">${esc(s.name)}</span><span>${esc(s.test)}</span><span class="crit">Pass: ${esc(s.criteria)}</span>
      <div class="row">${[['not-yet','Not yet','no'],['inconsistent','Inconsistent','inc'],['reliable','Reliable','yes']].map(([v,t,c])=>`<button class="chip ${c}" data-s="${s.id}" data-v="${v}" aria-pressed="${m===v}">${t}</button>`).join('')}</div></div>`}).join('')}</details>`}).join('')}
  <section class="panel"><div class="row"><button class="btn" id="finish">Save skills check</button><span class="muted" id="msg"></span></div></section>`;
  document.getElementById('back').onclick=()=>setView('player');
  V.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=b.dataset.s,v=b.dataset.v;const m={...(p.marks||{})};
    if(m[id]===v)delete m[id];else m[id]=v;p.marks=m;
    const y=window.scrollY;renderSkills();window.scrollTo(0,y);
    clearTimeout(renderSkills.t);renderSkills.t=setTimeout(()=>savePlayer(p,{marks:p.marks}),600)});
  document.getElementById('finish').onclick=async()=>{const ex=skillsLevel(p.marks||{});
    const f={marks:p.marks||{},exec:ex,skillsAt:new Date().toISOString()};if(p.iq)f.final=finalRating(p.iq.tier,ex);
    if(await savePlayer(p,f))setView('player')};
}

// ---------- report ----------
function strengths(p){const d=Object.keys(DOM).filter(k=>p.iq?.dom?.[k]!=null).sort((a,b)=>p.iq.dom[b]-p.iq.dom[a]);return {top:d.slice(0,2),low:d.slice(-2).reverse()}}
function workOn(p){
  const next=LEVELS.find(L=>parseFloat(L)>p.final)||null;
  const target=SKILLS.filter(s=>(p.marks?.[s.id]&&p.marks[s.id]!=='reliable')&&(parseFloat(s.level)<=(next?parseFloat(next):4.5)));
  return {next,items:target.sort((a,b)=>a.level.localeCompare(b.level)).slice(0,6)};
}
const DOM_TIP={pos:'Move with your partner as a unit and split-step as the opponent makes contact.',
  shot:'Match the shot to the ball: reset low balls, attack only balls above net height.',
  part:'Call every middle ball and lob, and shift together to close the gap between you.',
  read:'Watch the opponent, not just the ball: find the weaker side and the cues before a speed-up.',
  game:'Notice repeated lost points and change one thing: target, pace, or a timeout.'};
function reportText(p){const st=strengths(p),w=workOn(p),org=S.settings.org||'our program';
  return `Hi ${p.name.split(' ')[0]},

Thanks for completing the Court IQ assessment with ${org}. Your rating is ${fmt(p.final)}.

How it was set:
- Court IQ (scenario test): ${fmt(p.iq.tier)}
- Skills check (on court): ${fmt(p.exec)}
Your rating is the lower of your skills level and your court IQ plus 0.5.

Strongest areas: ${st.top.map(d=>DOM[d]).join(', ')}
Areas to develop: ${st.low.map(d=>DOM[d]).join(', ')}
${w.items.length?`\nSkills to work on${w.next?' toward '+LNAME[w.next]:''}:\n${w.items.map(s=>'- '+s.name+' (target: '+s.criteria+')').join('\n')}\n`:''}
${S.settings.assessor||''}`.trim();}
function reportHTML(p){
  const st=strengths(p),w=workOn(p),org=S.settings.org||'',date=new Date(p.skillsAt||p.iq?.at||Date.now()).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  const bar=(v,th)=>`<div style="height:12px;background:#e3e8e4;border-radius:3px;position:relative;overflow:hidden"><div style="width:${Math.round((v||0)*100)}%;height:100%;background:${v>=th?'#2f7d4f':v>=th-.15?'#b7791f':'#b33a3a'}"></div></div>`;
  const tested=LEVELS.map(L=>({L,st:levelStats(p.marks,L)})).filter(x=>x.st.marked);
  const markLabel={'reliable':'Reliable','inconsistent':'Inconsistent','not-yet':'Not yet'};
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap"><title>Court IQ Report · ${esc(p.name)}</title>
<style>body{margin:0;background:#f3f5f2;color:#17231d;font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:720px;margin:0 auto;padding:32px 20px;display:grid;gap:22px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;line-height:1.1}
h1{font-size:2rem;text-transform:uppercase}h1 span{color:#2f5d8a}h2{font-size:1.35rem;border-bottom:2px solid #2f5d8a;padding-bottom:4px}
.card{background:#fff;border:1px solid #d7dfd9;border-radius:10px;padding:20px;display:grid;gap:12px}
.lab{font:500 .72rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:#5b6a62}
.rating{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}.rating div{display:grid}.rating b{font:700 3.4rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:#2f5d8a}.rating .sm b{font-size:2rem;color:#17231d}
.row{display:grid;grid-template-columns:10rem 1fr 3rem;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
ul{margin:0;padding-left:20px;display:grid;gap:6px}table{border-collapse:collapse;width:100%;font-size:.94rem}td{padding:6px 4px;border-bottom:1px solid #e3e8e4;vertical-align:top}
.m{font-weight:600;white-space:nowrap}.m.reliable{color:#2f7d4f}.m.inconsistent{color:#b7791f}.m.not-yet{color:#b33a3a}
p{margin:0}.muted{color:#5b6a62;font-size:.92rem}@media print{body{background:#fff}.card{break-inside:avoid}}</style></head><body><div class="page">
<div><div class="lab">${esc(org)}${org&&p.event?' · ':''}${esc(p.event||'')}</div><h1>Court <span>IQ</span> Player Report</h1><p class="muted">${esc(p.name)} · ${date}${S.settings.assessor?' · Assessed by '+esc(S.settings.assessor):''}</p></div>
<div class="card"><div class="rating"><div><span class="lab">Rating</span><b>${fmt(p.final)}</b></div><div class="sm"><span class="lab">Court IQ</span><b>${fmt(p.iq.tier)}</b></div><div class="sm"><span class="lab">Skills check</span><b>${fmt(p.exec)}</b></div></div>
<p>Your rating combines what you know about the game with what you can do on court. It is the lower of your skills level and your court IQ plus half a level, so neither strong hands nor strong game sense alone sets it.</p></div>
<div class="card"><h2>Court IQ</h2><p>You worked through 25 game situations across five areas of doubles strategy. Each answer was scored against ratings from experienced players.</p>
${Object.keys(DOM).map(d=>`<div class="row"><span>${DOM[d]}</span>${bar(p.iq.dom[d],.75)}<span>${pctS(p.iq.dom[d])}</span></div>`).join('')}
<p><b>Strongest:</b> ${st.top.map(d=>DOM[d]).join(' and ')}.</p>
<p><b>To develop:</b> ${st.low.map(d=>DOM[d]).join(' and ')}.</p>
<ul>${st.low.map(d=>`<li><b>${DOM[d]}.</b> ${DOM_TIP[d]}</li>`).join('')}</ul>
<p class="muted">${p.iq.blind.length>=2?`On ${p.iq.blind.length} situations you were certain of an answer that wasn't a strong choice. Those are worth discussing with a coach, because confident habits are the hardest to spot.`:'Your confidence matched your answers well: when you were sure, you were usually right.'}</p></div>
<div class="card"><h2>Skills check</h2>${tested.map(({L})=>`<div><div class="lab" style="margin-bottom:4px">${LNAME[L]} skills</div><table>${SKILLS.filter(s=>s.level===L&&p.marks?.[s.id]).map(s=>`<tr><td>${esc(s.name)}<br><span class="muted">Target: ${esc(s.criteria)}</span></td><td class="m ${p.marks[s.id]}">${markLabel[p.marks[s.id]]}</td></tr>`).join('')}</table></div>`).join('')}</div>
${w.items.length?`<div class="card"><h2>What to work on${w.next?' toward '+LNAME[w.next]:''}</h2><ul>${w.items.map(s=>`<li><b>${esc(s.name)}.</b> ${esc(s.test)} Target: ${esc(s.criteria)}.</li>`).join('')}</ul></div>`:''}
<p class="muted">Court IQ assessment${org?' · '+esc(org):''}. Ratings are for event placement and may be reviewed after play.</p>
</div></body></html>`;
}
function renderReport(){
  const p=player();if(!p||p.final==null)return setView('player');
  const html=reportHTML(p);
  V.innerHTML=`<section class="panel"><div class="meta"><button class="linkbtn" id="back">← ${esc(p.name)}</button></div>
    <h2>Player report</h2>
    <p>Download the report and attach it to an email, or copy the short summary into the message body.${p.email?` Send to <b>${esc(p.email)}</b>.`:''}</p>
    <p class="muted" style="font-size:.9rem">The report shows ratings, domain results and skills. It doesn't include scenario text or answer keys, so the bank stays usable.</p>
    <div class="row">${S.downloads?'<button class="btn" id="dl">Download report</button>':''}<button class="btn ghost" id="copy">Copy summary</button>${p.email?'<button class="btn ghost" id="copyemail">Copy email address</button>':''}</div>
    <textarea id="summary" readonly style="min-height:220px">${esc(reportText(p))}</textarea></section>
  <section class="panel"><span class="label">Preview</span><iframe id="prev" title="Report preview" style="width:100%;height:900px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe></section>`;
  document.getElementById('prev').srcdoc=html;
  document.getElementById('back').onclick=()=>setView('player');
  const copy=async(t,el)=>{try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){if(el){el.focus();el.select()}toast('Select and copy the text')}};
  document.getElementById('copy').onclick=()=>copy(document.getElementById('summary').value,document.getElementById('summary'));
  document.getElementById('copyemail')?.addEventListener('click',()=>copy(p.email));
  document.getElementById('dl')?.addEventListener('click',async()=>{try{await S.downloads.save({filename:`Court-IQ-Report-${p.name.replace(/[^\w]+/g,'-')}.html`,data:new Blob([html],{type:'text/html'})});await savePlayer(p,{reportAt:new Date().toISOString()})}catch(e){if(e?.code!=='declined')toast('Download unavailable here')}});
}

// ---------- reference views ----------
function renderBank(){
  const items=BANK.filter(i=>S.bankLv==='all'||i.lv===S.bankLv||(S.bankLv==='anim'&&i.anim));
  V.innerHTML=`<section class="panel"><h2>Scenario bank</h2>
    <p class="muted">${BANK.length} scenarios, 3 per domain at each level. Each test draws 5 per level, one from each domain, 25 in all. Keys run from −2 to +2. Don't show this screen to players.</p>
    <div class="row">${['all',...LEVELS,'anim'].map(l=>`<button class="chip" aria-pressed="${S.bankLv===l}" data-l="${l}">${l==='all'?'All levels':l==='anim'?'Animated':LNAME[l]}</button>`).join('')}</div></section>
    ${items.map(it=>`<section class="panel"><span class="label">${it.id} · ${LNAME[it.lv]} · ${DOM[it.dom]}</span><h3>${esc(it.t)}</h3>${scene(it)}<p>${esc(it.sit)}</p>
      <div style="display:grid;gap:8px">${it.o.map(o=>`<div class="keyrow"><span class="k ${o[1]>0?'pos':o[1]<0?'neg':''}">${o[1]>0?'+':''}${o[1]}</span><span>${esc(o[0])}<br><span class="muted">${esc(o[2])}</span></span></div>`).join('')}</div></section>`).join('')}`;
  initScenes(V,{autoplay:false});
  V.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.bankLv=b.dataset.l;renderBank()});
}
function renderSkillsRef(){
  V.innerHTML=`<section class="panel"><h2>Skills list</h2><p class="muted">50 observable doubles skills, 10 per level: 3.0 to 4.5 from Drill Lab, plus 5.0. Use these for the on-court check.</p></section>
  ${LEVELS.map(L=>`<details class="lvl"><summary><span>${LNAME[L]}</span><span class="muted">10 skills</span></summary>${SKILLS.filter(s=>s.level===L).map(s=>`<div class="skill"><span class="name">${esc(s.name)} <span class="pill mut">${esc(s.category)}</span></span><span>${esc(s.test)}</span><span class="crit">Pass: ${esc(s.criteria)}</span></div>`).join('')}</details>`).join('')}`;
}
function renderSettings(){
  V.innerHTML=`<section class="panel"><h2>Settings</h2><p class="muted">These appear on player reports.</p>
    <label for="s-org">League or organization<input id="s-org" value="${esc(S.settings.org)}"></label>
    <label for="s-assessor">Assessor name<input id="s-assessor" value="${esc(S.settings.assessor)}"></label>
    <label for="s-event">Default event<input id="s-event" value="${esc(S.settings.event||'')}"></label>
    <div><button class="btn" id="s-save" ${S.ready?'':'disabled'}>Save settings</button></div></section>
    <section class="panel"><h3>How ratings work</h3>
    <p><b>Court IQ</b> is the highest level where the player scores 70%+ on the scenario items, with every lower level also passed. Each item scores the best pick's key minus the worst pick's key.</p>
    <p><b>Skills level</b> is the highest level with all 10 skills marked and 80%+, where each lower level is either fully tested at 90%+ or spot-checked with 3+ items all Reliable.</p>
    <p><b>Quarter steps.</b> A player who passes a level and comes close on the next one gets an extra 0.25 (for example 4.75): court IQ needs 55%+ on the next level's items; skills need every next-level item marked and 60%+.</p>
    <p><b>Rating</b> is the lower of the skills level and court IQ + 0.5.</p>
    <p class="muted">${S.local?'Player records are stored in this browser on this device. Back them up regularly, and restore the backup to move them to another device.':'Your player records are private to you. Other organizers using this tool see only their own.'}</p></section>
    ${S.local?`<section class="panel"><h3>Backup</h3><p class="muted">Clearing this browser's site data deletes your records. A backup file restores them on any device.</p>
    <div class="row"><button class="btn ghost" id="bk-save">Download backup</button><label class="btn ghost" for="bk-file" style="display:inline-block">Restore from backup<input id="bk-file" type="file" accept="application/json,.json" hidden></label></div>
    <p class="muted" id="bk-msg"></p></section>`:''}`;
  document.getElementById('s-save').onclick=async()=>{const s={type:'settings',org:document.getElementById('s-org').value.trim(),assessor:document.getElementById('s-assessor').value.trim(),event:document.getElementById('s-event').value.trim()};
    try{await col().doc('settings').set(s);S.settings=s;toast('Saved')}catch(e){toast('Couldn\'t save')}};
  if(!S.local)return;
  document.getElementById('bk-save').onclick=()=>localDownloads.save({filename:`court-iq-backup-${new Date().toISOString().slice(0,10)}.json`,data:new Blob([JSON.stringify({app:'court-iq',version:1,data:LocalDB.dump()},null,1)],{type:'application/json'})});
  document.getElementById('bk-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const msg=document.getElementById('bk-msg');
    try{const j=JSON.parse(await f.text());if(j.app!=='court-iq'||!j.data)throw 0;
      const cur=LocalDB.dump();for(const [k,v] of Object.entries(j.data))cur[k]={...(cur[k]||{}),...v};LocalDB.load(cur);
      const n=Object.values(j.data).reduce((a,c)=>a+Object.values(c).filter(d=>d.type==='player').length,0);msg.textContent=`Restored ${n} player record${n===1?'':'s'}. Records with the same ID were replaced by the backup.`}
    catch(err){msg.textContent='That file isn\'t a Court IQ backup.'}};
}

// ---------- local storage (when hosted outside claude.ai) ----------
const LocalDB=(()=>{const KEY='courtiq_db_v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  const subs=new Set();const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw {code:'storage',message:'This browser blocked saving. Check that site data is allowed.'}}subs.forEach(f=>f())};
  function collection(path){const c={path,
    doc(id){id=id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8));return {id,path:path+'/'+id,
      async get(){const v=data[path]?.[id];return {id,exists:!!v,data:()=>clone(v)}},
      async set(v){(data[path]??={})[id]=clone(v);save()},
      async update(v){const cur=data[path]?.[id];if(!cur)throw {code:'not_found',message:'Record not found'};Object.assign(cur,clone(v));save()},
      async delete(){if(data[path])delete data[path][id];save()}}},
    async add(v){const d=c.doc();await d.set(v);return d},
    onSnapshot(next){const f=()=>next({docs:Object.entries(data[path]||{}).map(([id,v])=>({id,exists:true,data:()=>clone(v)}))});subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}};return c}
  return {collection,dump:()=>clone(data),load:d=>{data=d;save()}};
})();
const localDownloads={async save({filename,data}){const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
function startSync(fail){
  col().onSnapshot(q=>{
    const docs=q.docs.map(d=>({...d.data(),_id:d.id}));
    const set=docs.find(d=>d._id==='settings');if(set)S.settings=set;
    const fresh=docs.filter(d=>d.type==='player');
    S.players=fresh.map(f=>{const old=S.players.find(o=>o._id===f._id);return old&&S.view!=='players'&&old._id===S.cur?old:f});
    const first=!S.ready;S.ready=true;
    if(first||S.view==='players')render();
  },e=>fail('Couldn\'t load player records ('+(e.code||'error')+').'));
}

// ---------- boot ----------
render();
(async()=>{
  const c=window.claude;const fail=t=>{const m=document.getElementById('gatemsg');if(m)m.textContent=t};
  if(!c?.use){S.local=true;S.db=LocalDB;S.uid='local';S.downloads=localDownloads;
    try{navigator.storage?.persist?.()}catch(e){}
    return startSync(fail);}
  const [db,user,downloads]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);
  S.downloads=downloads;
  if(!db||!user)return fail('Sign in to claude.ai to keep player records. You can still browse the scenario bank and skills list.');
  S.db=db;S.uid=await user.id();
  if(!S.uid)return fail('Sign in to claude.ai to keep player records.');
  if(await user.can('data.write')===false)return fail('Your access to this tool is view-only. Ask the person who shared it for Contributor access.');
  startSync(fail);
})();
</script>
